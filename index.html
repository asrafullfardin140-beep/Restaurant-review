<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Restaurant Review — a fresh place to discover your next favorite meal. Coming soon.">
  <title>Restaurant Review — Coming soon</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f6f2e9; color: #233b30; font-family: system-ui, sans-serif; }
    main { max-width: 760px; text-align: center; padding: 64px 20px; }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .badge { display: inline-block; margin: 64px 0 20px; padding: 9px 16px; border: 1px solid #bbc7b5; border-radius: 999px; font-size: 13px; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(48px, 9vw, 88px); font-weight: 400; line-height: 1.06; letter-spacing: -.045em; }
    .description { max-width: 440px; margin: 28px auto 0; color: #526257; font-size: 18px; line-height: 1.7; }
    footer { margin-top: 72px; font-size: 13px; color: #526257; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Restaurant Review</div>
    <div class="badge">Coming soon</div>
    <h1>Your next favorite<br>meal is waiting.</h1>
    <p class="description">A fresh place to discover restaurants and share memorable meals. Something delicious is on its way.</p>
    <footer>Good food. Honest reviews. New discoveries.</footer>
  </main>
</body>
</html>
